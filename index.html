<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket Code Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #000;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #canvasContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="canvasContainer">

    <!-- Player do Pocket Code em HTML5 -->
    <script src="https://share.catrob.at/html5/pocketCode.min.js"></script>
    <script>
        window.addEventListener('load', function () {
            try {
                var gameData = JSON.parse(document.getElementById('game-data').textContent);
                if (typeof PocketCode !== 'undefined' && PocketCode.Player) {
                    var player = new PocketCode.Player('stageContainer');
                    player.loadProject(gameData);
                }
            } catch (e) {
                console.error("Erro ao carregar o projeto do Pocket Code:", e);
            }
        });
    </script>
