    padding:12px 22px;border-radius:999px;font-weight:700;text-decoration:none;max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #rotate{position:fixed;top:0;left:0;right:0;display:none;z-index:6;background:#ffcc33;color:#1a1300;font-weight:700;
    padding:10px;text-align:center;font-size:14px;pointer-events:none}
